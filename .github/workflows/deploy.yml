name: 部署站点到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN 权限：读取代码、写入 Pages、生成部署令牌
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只允许一次部署，新部署取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 构建站点
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.21.0

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 验证前端
        run: pnpm test

      - name: 构建站点
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          VITE_PUBLIC_SERVICE_URL: ${{ vars.VITE_PUBLIC_SERVICE_URL }}
          VITE_GISCUS_CATEGORY_ID: ${{ vars.VITE_GISCUS_CATEGORY_ID }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: pnpm build --base "$PAGES_BASE_PATH/"

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: 部署到 Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
