[package]
name = "admin-desktop"
version = "0.1.0"
description = "箓川码笺管理端桌面应用"
authors = ["lucan"]
edition = "2021"

[lib]
name = "admin_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
tokio = { version = "1", features = ["full"] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["native-tls"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
